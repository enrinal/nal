{{ define "head" }}
<style>
.post { max-width: var(--measure); margin: clamp(2rem, 5vw, 3.5rem) auto 0; }
.post-meta { display: flex; gap: 1rem; padding-bottom: .6rem; border-bottom: 3px solid var(--ink); }
.post h1 { margin: 1.25rem 0 0; font-size: clamp(2.1rem, 1.3rem + 3vw, 3.5rem); font-weight: 800; font-stretch: 80%; letter-spacing: -.025em; line-height: 1.02; }
.post .lede { margin: 1rem 0 2.25rem; font-size: 1.3rem; color: var(--ink-2); line-height: 1.4; }
.post-foot { max-width: var(--measure); margin: 3.5rem auto 0; padding-top: 1rem; border-top: 1px solid var(--rule); }
.post-foot a { font-weight: 650; text-decoration: none; }
.post-foot a:hover { text-decoration: underline; }
</style>
{{ end }}

{{ define "main" }}
<article class="post">
  <div class="post-meta"><time class="label" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time></div>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  <div class="prose">{{ .Content }}</div>
</article>
<p class="post-foot"><a href="/blog/">All posts</a></p>
{{ end }}
