{{ define "head" }}
<style>
.post time { color: var(--fg-3); font-size: .95rem; }
.post h1 { margin: .4rem 0 0; font-size: clamp(2rem, 1.5rem + 2vw, 2.6rem); font-weight: 700; letter-spacing: -.025em; line-height: 1.15; }
.post .lede { margin: .9rem 0 2.25rem; font-size: 1.25rem; color: var(--fg-2); line-height: 1.5; }
.post-foot { margin: 3.5rem 0 0; padding-top: 1.25rem; border-top: 1px solid var(--rule); }
</style>
{{ end }}

{{ define "main" }}
<article class="post">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  <div class="prose">{{ .Content }}</div>
</article>
<p class="post-foot"><a href="/blog/">All posts</a></p>
{{ end }}
