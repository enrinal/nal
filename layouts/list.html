{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="posts">
{{ range .Pages }}
  <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
{{ else }}
  <li class="muted">No posts yet.</li>
{{ end }}
</ul>
{{ end }}
