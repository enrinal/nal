# Home page copy. Restates resume facts in plain first-person English; no new claims.
intro:
  - I'm a senior backend engineer in Jakarta with 8+ years of building booking and payment systems in Go and Java.
  - At Tiket.com I own the core flight booking services, which handle over 100,000 bookings a day. Most of my work is about keeping bookings correct through retries, failures, and peak traffic. I also work with the Hotel and Promo teams on projects where flights, hotels, and promos have to work together.
now:
  - Designed server-side carts for flight checkout, so travelers can come back to an abandoned cart or recover an expired one in one tap.
  - Made booking idempotent, so a retried request returns the original booking instead of booking the same order twice with the airline.
  - Fixed an off-heap memory leak that crashed every flight-cart pod about 12 times a month.
  - Built booking health dashboards and alerts that catch drops in supplier success or order creation early.
  - I lead design reviews, on-call, and post-mortems for a team of five engineers.

experience:
  - company: Tiket.com
    place: Jakarta, Indonesia
    from: 2022
    to: now
    roles:
      - title: Senior Backend Engineer II
        dates: Jul 2026 – Present
        items:
          - Architected server-side cart lifecycle management for flight checkout, with abandoned-cart re-engagement, exactly-once push notifications, and one-tap recovery of expired carts. Built on Spring WebFlux, Redis, and Kafka.
          - Designed idempotent booking with a distributed lock and request coalescing to fix a race condition that could book the same order twice with the airline. Retries across all 7 booking API versions now return the original booking.
          - Root-caused and fixed an off-heap Netty memory leak that crashed every flight-cart pod about 12 times a month.
          - Built booking health monitoring for the flight platform, with Grafana dashboards and alerts for drops in supplier booking success, spikes in business errors, and falls in order creation. Added cache hit-rate and Kafka consumer lag metrics across 4 services.
          - Lead system design reviews, on-call, and incident post-mortems for a team of 5 engineers, and drive cross-vertical projects with the Hotel and Promo teams.
      - title: Senior Software Engineer, Backend
        dates: Aug 2022 – Jul 2026
        items:
          - Led the consolidation of fragmented MongoDB databases into a single cluster and redesigned the data model to eliminate cross-database joins, cutting p99 latency by 40% and database cost by about 30%; later adopted by other verticals.
          - Cut Redis memory by about 75% with Brotli payload compression and jittered TTLs that prevent cache stampedes at peak traffic; later adopted by other verticals.
          - Led the Flight + Hotel package booking, a cross-vertical project spanning two independent booking systems. Built a saga orchestrator in Go with compensating transactions, eliminating charged-but-unbooked orders.
          - Built a rule-based pricing engine for add-ons that lets product teams launch pricing changes without a deployment, lifting upsell conversion by about 13%.
