        items:
          - Designed and built server-side cart management for flight checkout so users can recover an expired cart in one tap and get a reminder when they abandon one, improving the look-to-book ratio by about 15%.
          - Made booking idempotent across all 7 booking API versions to close a race condition that could book the same order twice with the airline, cutting duplicates from 100–200 a day to zero.
