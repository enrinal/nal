          - Split tightly coupled legacy flight services into separate services and standardized shared internal libraries across squads, so teams ship features in parallel and new engineers ramp up about 35% faster.
          - Created a rule-based pricing engine for add-ons that lets product teams launch pricing changes without a deployment, lifting upsell conversion by about 13%.
